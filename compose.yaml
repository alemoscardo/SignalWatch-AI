services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: signalwatch
      POSTGRES_USER: signalwatch
      POSTGRES_PASSWORD: ${SIGNALWATCH_DB_PASSWORD:?Set SIGNALWATCH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalwatch -d signalwatch"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
